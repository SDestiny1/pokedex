<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar>
    <ion-title class="ion-text-center">
      <strong>Pokédex</strong>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="pokemon-grid">
    @for(pokemon of pokemons; track pokemon){
    <ion-card (click)="goToPage(pokemon)" button class="pokemon-card">
      <div class="card-header" [class]="'bg-' + pokemon.type1">
        <div class="pokemon-id">#{{pokemon.id}}</div>
      </div>
      <div class="card-body">
        <ion-img [src]="pokemon.sprite" class="pokemon-sprite" />
        <h3 class="pokemon-name">{{pokemon.name}}</h3>
        <div class="type-badges">
          <span [class]="'type-badge type-' + pokemon.type1"
            >{{pokemon.type1}}</span
          >
          @if (pokemon.type2) {
          <span [class]="'type-badge type-' + pokemon.type2"
            >{{pokemon.type2}}</span
          >
          }
        </div>
        <div class="pokemon-stats">
          <div class="stat">
            <span class="stat-icon">📏</span>
            <span class="stat-value">{{pokemon.height}}m</span>
          </div>
          <div class="stat">
            <span class="stat-icon">⚖️</span>
            <span class="stat-value">{{pokemon.weight}}kg</span>
          </div>
        </div>
      </div>
    </ion-card>
    }
  </div>

  <ion-infinite-scroll (ionInfinite)="getMorePokemons($event)">
    <ion-infinite-scroll-content
      loadingText="Loading more..."
      loadingSpinner="circular"
    >
    </ion-infinite-scroll-content>
  </ion-infinite-scroll>
</ion-content>
